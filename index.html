<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZERIX CITY</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#090909;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#intro{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#070707,#1b0000,#070707);
animation:bg 6s infinite alternate;
}

@keyframes bg{
0%{filter:brightness(1);}
100%{filter:brightness(1.3);}
}

.logo{
width:340px;
filter:drop-shadow(0 0 40px red);
animation:intro 3s forwards, floatRotate 8s ease-in-out infinite;
transform-origin:center;
}

@keyframes intro{
0%{
opacity:0;
transform:scale(.2) rotate(-20deg);
}
40%{
opacity:1;
}
70%{
transform:scale(1.15) rotate(0deg);
}
100%{
opacity:1;
transform:scale(1);
}

  .player{
position:fixed;
right:25px;
bottom:25px;
width:320px;
background:rgba(0,0,0,.75);
border:1px solid rgba(255,0,0,.35);
border-radius:18px;
padding:18px;
color:#fff;
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(255,0,0,.2);
}

.player-title{
color:#ff3b3b;
font-size:14px;
margin-bottom:10px;
letter-spacing:2px;
}

.song-name{
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.controls{
display:flex;
justify-content:center;
gap:15px;
}

.controls button{
width:48px;
height:48px;
border:none;
border-radius:50%;
background:#1b1b1b;
color:#fff;
font-size:18px;
cursor:pointer;
transition:.2s;
}

.controls button:hover{
background:#ff2b2b;
transform:scale(1.1);
}
</style>
</head>

<body>
<div id="intro">

    <img src="logo.png" class="logo">

</div>



<div class="player">
    <div class="player-title">ZERIX PLAYLIST</div>

    <div class="song-name" id="songName">music1.mp3</div>

   
</div>

<div class="progress" id="progress">
    <div class="progress-fill" id="progressFill"></div>
</div>

<div class="time">
    <span id="currentTime">0:00</span>
    <span id="duration">0:00</span>
</div>

<div id="playlist"></div>

<audio id="audio"></audio>
        <button id="prevBtn">⏮</button>
        <button id="playBtn">▶</button>
        <button id="nextBtn">⏭</button>
      <div class="volume-box">
    <span>🔊</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.25">
<div class="volume-box">
    <span>🔊</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.25">
</div>

<script>
const songs = [
    {
        name: "music1.mp3",
        file: "music1.mp3"
    },
    {
        name: "music2.mp3",
        file: "music2.mp3"
    },
    {
        name: "music3.mp3",
        file: "music3.mp3"
    }
];

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const volume = document.getElementById("volume");
const songName = document.getElementById("songName");

let currentSong = 0;

audio.volume = volume.value;

function loadSong(index){
    currentSong = index;
    audio.src = songs[index].file;
    songName.textContent = songs[index].name;
    audio.load();
}

playBtn.onclick = () => {
    if(audio.paused){
        audio.play();
        playBtn.innerHTML = "⏸";
    }else{
        audio.pause();
        playBtn.innerHTML = "▶";
    }
};

nextBtn.onclick = () => {
    currentSong++;
    if(currentSong >= songs.length) currentSong = 0;
    loadSong(currentSong);
    audio.play();
    playBtn.innerHTML = "⏸";
};

prevBtn.onclick = () => {
    currentSong--;
    if(currentSong < 0) currentSong = songs.length - 1;
    loadSong(currentSong);
    audio.play();
    playBtn.innerHTML = "⏸";
};

volume.oninput = () => {
    audio.volume = volume.value;
};

loadSong(0);
</script>
</body>
</html>
