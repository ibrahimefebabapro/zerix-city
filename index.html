<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZERIX CITY</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#090909;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#intro{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#070707,#1b0000,#070707);
animation:bg 6s infinite alternate;
}

@keyframes bg{
0%{filter:brightness(1);}
100%{filter:brightness(1.3);}
}

.logo{
width:340px;
opacity:0;
transform:scale(.2) rotate(-20deg);
animation:intro 3s forwards;
filter:drop-shadow(0 0 40px red);
}

@keyframes intro{
0%{
opacity:0;
transform:scale(.2) rotate(-20deg);
}
40%{
opacity:1;
}
70%{
transform:scale(1.15) rotate(0deg);
}
100%{
opacity:1;
transform:scale(1);
}
}
</style>

</head>

<body>

<div id="intro">

<img src="logo.png" class="logo">

</div>

</body>
</html>
